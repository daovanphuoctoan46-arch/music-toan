<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Aura Player</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <!-- Glassmorphism Futuristic Player -->
    <div id="player-glass" class="glass-player">
      <div class="player-header">
        <div class="search-wrapper">
          <input type="text" class="search-input" id="searchInput" placeholder="Tìm kiếm bài hát hoặc nghệ sĩ..." autocomplete="off">
          <button class="search-icon-btn" id="searchBtnUI"><span class="icon">🔍</span></button>
        </div>
      </div>

      <div class="player-top">
        <div class="player-info-center">
          <div class="track-meta">
            <h1 class="track-title" id="mainTitle">Sẵn sàng</h1>
            <p class="track-artist" id="mainArtist">Nhập tên bài hát ở trên để bắt đầu</p>
          </div>
          
          <div class="progress-container">
            <div class="progress-bar-bg" id="progressTrack">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-time">
              <span id="timeNow">0:00</span>
              <span id="timeTotal">0:00</span>
            </div>
          </div>
          
          <div class="playback-buttons">
            <button class="control-btn shuffle"><span class="icon">🔀</span></button>
            <button class="control-btn prev"><span class="icon">⏮</span></button>
            <button class="control-btn play-pause-btn" id="playPauseBtn"><span class="icon">▶</span></button>
            <button class="control-btn next"><span class="icon">⏭</span></button>
            <button class="control-btn repeat"><span class="icon">🔁</span></button>
          </div>
        </div>
        
        <div class="player-right-controls">
          <div class="volume-control">
            <span class="icon">🔊</span>
            <div class="volume-slider" id="volTrack">
              <div class="volume-fill" id="volFill" style="width: 80%"></div>
            </div>
          </div>
          <div class="utility-btns">
            <button class="control-btn fav"><span class="icon">♥</span></button>
            <button class="control-btn list"><span class="icon">☰</span></button>
          </div>
        </div>
      </div>
      
      <div class="divider"></div>
      
      <div class="lyrics-container">
        <div class="lyrics-scroll" id="lyricsScroll">
          <div class="lyric-line active">Chào mừng bạn đến với Cosmic Aura</div>
          <div class="lyric-line near">Cảm hứng âm nhạc từ vũ trụ</div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
